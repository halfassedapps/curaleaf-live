name: Track first-seen dates

on:
  schedule:
    - cron: "17 13 * * *"  # ~9am ET (GitHub may start scheduled runs late)
  workflow_dispatch:

permissions:
  contents: write

concurrency: track

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/track.py
      - name: Commit changes
        run: |
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily first-seen update $(TZ=America/New_York date +%F)"
          git push
